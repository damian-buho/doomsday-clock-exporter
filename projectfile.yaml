---
# SPDX-FileCopyrightText: 2026 Damián Búho <damian.buho@proton.me>
#
# SPDX-License-Identifier: MIT
$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-05-28"
  name: doomsday-clock-exporter
  summary: Prometheus exporter for Doomsday Clock value
  title: Doomsday Clock Exporter
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/go.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/library/languages/go.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/o9s/metadata/raw/branch/main/include.yaml
kind: SoftwareSourceCode
links:
  - label: Doomsday Clock Exporter on Codeberg
    type: source-code
    url: https://codeberg.org/o9s/doomsday-clock-exporter
  - label: Doomsday Clock Exporter on GitHub
    type: source-code
    url: https://github.com/damian-buho/o9s-doomsday-clock-exporter
  - label: Doomsday Clock Exporter on kiota.ch
    type: source-code
    url: https://kiota.ch/o9s/doomsday-clock-exporter
  - label: Issues on Codeberg
    type: bugs
    url: https://codeberg.org/o9s/doomsday-clock-exporter/issues
  - label: Issues on GitHub
    type: bugs
    url: https://github.com/damian-buho/o9s-doomsday-clock-exporter/issues
org:
  projectfile:
    artifacts:
      go-binary:
        kind: binary
        path: dist/doomsday-clock-exporter
    build:
      args:
        GOPROXY: ""
    ci:
      forgejo:
        credentials:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      nodes:
        binaries-built:
          matrix:
            axes:
              GOARCH:
                - amd64
              GOOS:
                - linux
          needs:
            build-binaries: true
            gsa: true
            source-is-ready: true
        binaries-released:
          matrix:
            axes:
              GOARCH:
                - amd64
              GOOS:
                - linux
          needs:
            binaries-built: true
            forgejo-release: true
            gh-release: true
          when:
            events:
              - tag
        published:
          needs:
            binaries-released: true
      tools:
        build-binaries:
          artifact: dist
          env:
            - GOPROXY
            - GOOS
            - GOARCH
            - GITHUB_REF_NAME
          guard: go.mod
          image: GO_TOOL_IMAGE
          m6e:
            prefer-local: true
          run: .scripts/build-binaries.sh
        forgejo-release:
          action: forgejo-release
          env:
            - FORGEJO_TOKEN
          gha: false
          m6e: false
        gh-release:
          env:
            - GH_TOKEN
          forgejo: false
          m6e: false
          run: .scripts/gh-release.sh "$${{ github.ref_name }}"
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - issues: true
    role: mirror
    type: git
    url: ssh://git@codeberg.org/o9s/doomsday-clock-exporter.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/o9s-doomsday-clock-exporter.git
  - role: origin
    type: git
    url: ssh://git@kiota.ch/o9s/doomsday-clock-exporter.git
