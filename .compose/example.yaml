---
services:
  doomsday-clock-exporter:
    image: docker.io/damianbuho/doomsday-clock-exporter:latest
    ports:
      - "8080:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
